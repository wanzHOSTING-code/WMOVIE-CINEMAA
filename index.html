<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jadwal Film Bioskop</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="search-location">
      <div class="search-bar">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>
        <input type="text" id="search" placeholder="Cari di TIX ID" />
      </div>
      <div class="location-select">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <select id="location-select" aria-label="Pilih lokasi">
          <option value="Bogor" selected>BOGOR</option>
          <option value="Jakarta">JAKARTA</option>
          <option value="Bandung">BANDUNG</option>
        </select>
      </div>
    </div>
  </header>

  <section class="banner" id="banner">
    <div class="banner-content">
      <div class="promo-tag">KUOTA TERBATAS</div>
      <h1>BELI <span>1</span> GRATIS <span>1</span></h1>
      <h2 id="banner-title">OZORA</h2>
      <p id="banner-description">Penganiayaan Brutal Penguasa Jaksel</p>
      <p class="period">Periode: <strong>4 - 7 Desember 2025</strong></p>
      <div class="cinemas">XXI&nbsp;&nbsp;|&nbsp;&nbsp;CGV&nbsp;&nbsp;|&nbsp;&nbsp;cinépolis</div>
      <button class="btn-buy" aria-label="Beli tiket OZORA">BELI DI SINI</button>
    </div>
  </section>

  <main>
    <section class="movie-section">
      <div class="section-header">
        <h2>🎬 Sedang Tayang</h2>
        <button id="view-all" aria-label="Lihat Semua Film">Semua &gt;</button>
      </div>
      <div class="filters" role="tablist" aria-label="Filter Bioskop">
        <button class="filter active" data-cinema="all" role="tab" aria-selected="true">Semua Film</button>
        <button class="filter" data-cinema="XXI" role="tab" aria-selected="false">XXI</button>
        <button class="filter" data-cinema="CGV" role="tab" aria-selected="false">CGV</button>
        <button class="filter" data-cinema="Cinépolis" role="tab" aria-selected="false">Cinépolis</button>
      </div>
      <div class="movies" id="movies-container" aria-live="polite" aria-label="Daftar Film Sedang Tayang">
        <!-- Film akan dimuat di sini -->
      </div>
    </section>
  </main>

  <div id="trailer-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="trailer-title">
    <div class="modal-content">
      <button class="close-btn" aria-label="Tutup">&times;</button>
      <iframe id="trailer-video" width="100%" height="400" frameborder="0" allowfullscreen title="Trailer Film"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
